name: ai-consultation

services:
  db:
    image: postgres:16-alpine
    container_name: ai-consultation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_consultation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_consultation"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: ai-consultation-postgres-data
